[package]
name = "nuenly-mcp"
description = "MCP client Nuenly: server terikat mode, policy gate allow/ask/deny, dan ToolPin untuk definisi tool yang berubah."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
nuenly-core.workspace = true
# Membungkus proses server stdio dalam job object agar proses turunannya (npx → node) ikut
# berhenti. Versi dan fitur yang sama sudah dipakai rmcp.
process-wrap.workspace = true
rmcp.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["process", "time"] }

[target.'cfg(windows)'.dependencies]
# Hanya tipe PROCESS_CREATION_FLAGS untuk CREATE_NO_WINDOW; tanpa panggilan Win32 langsung.
windows = { workspace = true, features = ["Win32_System_Threading"] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "io-std", "io-util"] }

# Test stdio menjalankan binary test-nya sendiri sebagai server MCP sintetis, jadi butuh main sendiri.
[[test]]
name = "stdio"
harness = false

[lints]
workspace = true
