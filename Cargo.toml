[workspace]
resolver = "3"
members = ["app", "crates/*", "tools/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
nuenly-core = { path = "crates/nuenly-core" }
nuenly-platform-windows = { path = "crates/nuenly-platform-windows" }

anyhow = "1.0.104"
tauri = "2.12.5"
tauri-build = "2.7.4"
thiserror = "2.0.21"
# `input` wajib karena uiautomation 0.25.1 tidak terkompilasi tanpanya. Aksi tulisnya
# (klik, kirim tombol, set value) dikunci lewat disallowed-methods di clippy.toml.
uiautomation = { version = "0.25.1", default-features = false, features = ["input", "pattern"] }
windows = "0.62.2"
zeroize = "1.9.1"

# `unsafe_code` sengaja tidak diset di sini: crate platform butuh `unsafe`, dan cargo
# tidak mengizinkan satu crate menimpa sebagian lint workspace. Crate selain
# nuenly-platform-windows memasang `#![forbid(unsafe_code)]` di lib.rs.
[workspace.lints.rust]
rust_2018_idioms = { level = "warn", priority = -1 }
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
undocumented_unsafe_blocks = "deny"
dbg_macro = "deny"
